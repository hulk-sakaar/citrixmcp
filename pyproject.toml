[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citrix-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "html2text>=2024.2.26",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
citrix-mcp = "citrix_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citrix_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
